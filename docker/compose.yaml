name: itri-retail

x-dev: &dev
  image: itri-retail-robot:humble-dev
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: dev
    args:
      USER_UID: ${LOCAL_UID:-1000}
      USER_GID: ${LOCAL_GID:-1000}
  init: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment:
    ROS_LOCALHOST_ONLY: "1"
    ROS_DOMAIN_ID: "82"
    RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
    PYTHONDONTWRITEBYTECODE: "1"
    # Standalone tooling has no /opt/retail_ws underlay; its shared workspace
    # must not auto-load an overlay compiled against the sim image.
    RETAIL_BAKED_ONLY: "1"
  volumes:
    - .:/workspace
  working_dir: /workspace/ros2_ws

services:
  # Definitions stay in their own file, but remain known to every Compose entry.
  # The camera profile is inactive until explicitly selected.
  cameras:
    extends:
      file: docker/compose.realsense.yaml
      service: cameras
    volumes:
      - type: bind
        source: ${REALSENSE_CONFIG:-./ros2_ws/src/retail_bringup/config/cameras.example.yaml}
        target: /config/cameras.yaml
        read_only: true
        bind:
          create_host_path: false
  camera-probe:
    extends:
      file: docker/compose.realsense.yaml
      service: camera-probe

  ros-smoke:
    image: itri-retail-robot:ros-smoke
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: smoke
    network_mode: none
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      ROS_LOCALHOST_ONLY: "1"
      ROS_DOMAIN_ID: "82"
    command: ["python3", "/opt/itri/ros_smoke.py"]

  # One-off shell with outbound network for vcs/rosdep. No host networking/devices.
  dev:
    <<: *dev
    profiles: [dev]
    stdin_open: true
    tty: true
    command: ["bash"]

  # Offline acceptance uses the same toolchain, with its own isolated ROS graph.
  dev-check:
    <<: *dev
    profiles: [test]
    network_mode: none
    command: ["bash", "/opt/itri/dev_check.bash"]

  sim:
    image: itri-retail-robot:humble-sim
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: sim
      args:
        USER_UID: ${LOCAL_UID:-1000}
        USER_GID: ${LOCAL_GID:-1000}
    profiles: [sim]
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    shm_size: 256mb
    environment:
      ROS_LOCALHOST_ONLY: "1"
      ROS_DOMAIN_ID: "83"
      CYCLONEDDS_URI: file:///opt/itri/cyclonedds-local.xml
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      RETAIL_BAKED_ONLY: "1"
      # docker exec does not inherit exports made by run_sim.bash.
      # Keep every interactive shell on the same container-local desktop.
      DISPLAY: ":99"
      LIBGL_ALWAYS_SOFTWARE: "1"
      QT_X11_NO_MITSHM: "1"
      RVIZ_BROWSER: ${RVIZ_BROWSER:-1}
      VQA_BACKEND: ${VQA_BACKEND:-fixture}
      HAND_BACKEND: ${HAND_BACKEND:-fixture}
      VQA_CAMERAS: ${VQA_CAMERAS:-chest}
      CAMERA_SOURCE: ${CAMERA_SOURCE:-synthetic}
      VIDEO_PATH: ${VIDEO_PATH:-}
      RECONSTRUCTION_URL: ${RECONSTRUCTION_URL:-}
    ports:
      - "127.0.0.1:${RVIZ_PORT:-6080}:6080"
    volumes:
      - .:/workspace:ro
      - ${VIDEO_DIR:-./data/video}:/data/video:ro

  # Optional GPU worker; ROS interfaces remain in sim/perception adapters.
  vqa-worker:
    image: ${VQA_WORKER_IMAGE:-itri-retail-robot:vqa-worker}
    profiles: [vqa]
    init: true
    gpus: all
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: ["python3", "/app/vqa_worker.py"]
    environment:
      PYTHONPATH: /upstream/vqa
      VQA_CHECKPOINT: /models/vqa
      VQA_DEVICE: cuda:0
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8090/health',timeout=3))['ready']"]
      interval: 5s
      timeout: 4s
      start_period: 60s
      retries: 6
    volumes:
      - ./docker/vqa_worker.py:/app/vqa_worker.py:ro
      - type: bind
        source: ${VQA_SOURCE_DIR:-./external/VLMotion_VQA/ros2_ws/src/lightweight_risk_vqa}
        target: /upstream/vqa
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VQA_CHECKPOINT_DIR:-./models/vqa}
        target: /models/vqa
        read_only: true
        bind:
          create_host_path: false
