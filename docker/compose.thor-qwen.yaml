# Add after compose.cross-host.yaml to replace only the THOR inference worker.
services:
  vqa-worker:
    image: itri-retail-robot:thor-vqa-qwen-yolo
    build:
      dockerfile: docker/Dockerfile.vqa-yolo
      args:
        VQA_BASE_IMAGE: itri-retail-robot:thor-vqa
        INSTALL_OPENCV_RUNTIME: '1'
    environment:
      VQA_MODEL_BACKEND: qwen3-vl
      YOLO_WEIGHTS: /models/yolov8n.pt
      YOLO_CONFIG_DIR: /tmp/Ultralytics
      QWEN_STOP_BOX_AREA_RATIO: ${QWEN_STOP_BOX_AREA_RATIO:-0.40}
      QWEN_FAR_BOX_AREA_RATIO: ${QWEN_FAR_BOX_AREA_RATIO:-0.10}
    volumes:
      - type: bind
        source: ${THOR_QWEN_MODEL_DIR:-./models/Qwen3-VL-2B-Instruct}
        target: /models/vqa
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${YOLO_MODEL_FILE:-./models/yolo/yolov8n.pt}
        target: /models/yolov8n.pt
        read_only: true
        bind:
          create_host_path: false
