<text x="595" y="160" class="note">Current visual features</text>
<polyline points="1060,275 1110,275" fill="none" stroke="#516174" stroke-width="2.4" marker-end="url(#arrow)"/><polygon points="1110.0,275.0 1099.0,271.0 1099.0,279.0" fill="#516174"/>
<polyline points="1240,338 1240,426" fill="none" stroke="#516174" stroke-width="2.4" marker-end="url(#arrow)"/><polygon points="1240.0,426.0 1244.0,415.0 1236.0,415.0" fill="#516174"/>
<text x="1250" y="390" class="note">&lt;seg&gt; hidden state</text>
<polyline points="377,325 377,391 1090,391 1090,470" fill="none" stroke="#516174" stroke-width="2.4" marker-end="url(#arrow)"/><polygon points="1090.0,470.0 1094.0,459.0 1086.0,459.0" fill="#516174"/>
<text x="535" y="380" class="note">Spatial + memory maps</text>
<polyline points="650,325 650,441" fill="none" stroke="#516174" stroke-width="2.4" marker-end="url(#arrow)" stroke-dasharray="6 4"/><polygon points="650.0,441.0 654.0,430.0 646.0,430.0" fill="#516174"/>
<polyline points="580,225 580,190 710,190 710,225" fill="none" stroke="#516174" stroke-width="2.4" marker-end="url(#arrow)" stroke-dasharray="6 4"/><polygon points="710.0,225.0 714.0,214.0 706.0,214.0" fill="#516174"/>
<text x="595" y="183" class="note">Recurrent h,c</text>
<rect x="28" y="104" width="174" height="101" rx="12" fill="#eaf2ff" stroke="#487ec3" stroke-width="2" stroke-dasharray="8 5"/>
<text x="43" y="132" class="head">Optional YOLO</text>
<text x="43" y="158" class="body">Separate detector</text>
<text x="43" y="181" class="body">Count + bbox history</text>
<polyline points="202,151 215,151 215,112 1245,112 1245,212" fill="none" stroke="#516174" stroke-width="2.4" marker-end="url(#arrow)" stroke-dasharray="6 4"/><polygon points="1245.0,212.0 1249.0,201.0 1241.0,201.0" fill="#516174"/>
<text x="485" y="98" class="note">Noisy numeric hints in text query; no fixed image zones</text>
<text x="285" y="647" class="body">Keeps visual encoding, recurrent state and VQA.</text>
<text x="250" y="671" class="note">Live outputs: action / people source / latency / explanation / full raw response. Invalid or stale result: DATA_LOSS.</text>
<rect x="28" y="718" width="1377" height="151" rx="12" fill="#fff8ef" stroke="#d08a39" stroke-width="2" stroke-dasharray="8 5"/>
<text x="43" y="746" class="head">RETAINED TWO-MODEL BASELINE  |  ConvLSTM segmentation + external LLaVA</text>
<rect x="52" y="762" width="405" height="81" rx="12" fill="#fff" stroke="#d08a39" stroke-width="2"/>
<text x="67" y="790" class="head">Model 1: temporal segmentation</text>
<text x="67" y="816" class="body">MobileNet + ConvLSTM + Qwen &lt;seg&gt; + mask</text>
<rect x="515" y="762" width="320" height="81" rx="12" fill="#fff" stroke="#d08a39" stroke-width="2"/>
<text x="530" y="790" class="head">Image interface</text>
<text x="530" y="816" class="body">Current frame + red mask overlay</text>
<rect x="895" y="762" width="483" height="81" rx="12" fill="#fff" stroke="#d08a39" stroke-width="2"/>
<text x="910" y="790" class="head">Model 2: external LLaVA / RoboPoint worker</text>
<text x="910" y="816" class="body">Separate weights + service; produces VQA text</text>
<polyline points="457,801 515,801" fill="none" stroke="#516174" stroke-width="2.4" marker-end="url(#arrow)"/><polygon points="515.0,801.0 504.0,797.0 504.0,805.0" fill="#516174"/>
<polyline points="835,801 895,801" fill="none" stroke="#516174" stroke-width="2.4" marker-end="url(#arrow)"/><polygon points="895.0,801.0 884.0,797.0 884.0,805.0" fill="#516174"/>
<rect x="28" y="904" width="1377" height="110" rx="12" fill="#f3f5f7" stroke="#9ba7b5" stroke-width="2"/>
<text x="43" y="932" class="head">OFFLINE DATA GENERATION — excluded from vqa-only live inference</text>
<text x="43" y="958" class="body">Human COCO / JAAD / MeViS labels + SAM3 masks + YOLO geometry + frozen Qwen3-VL-2B captions/counts.</text>
<text x="43" y="981" class="body">Teachers are not fine-tuned here. Retail motion, intention and collision labels are not human ground truth.</text>
</svg>