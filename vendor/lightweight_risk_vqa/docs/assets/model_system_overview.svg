<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-labelledby="title desc">
<title id="title">Lightweight temporal VQA: model boundaries and optional paths</title>
<desc id="desc">One integrated bundle shares MobileNet, FPN and ConvLSTM across Qwen VQA, optional masks, and an experimental motion head. Optional YOLO is a separate detector. A separate external LLaVA baseline consumes the camera frame and mask. Offline teachers are not live models.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#516174"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#172b46}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#526174}.head{font-size:18px;font-weight:700}.body{font-size:16px}.note{font-size:15px;fill:#526174}</style>
<rect width="1440" height="1050" fill="#fff"/>
<text x="35" y="43" class="title">Lightweight Temporal VQA — deployed model boundaries</text>
<text x="35" y="72" class="sub">A unified checkpoint has multiple functions. A segmentation mask is not fed back into embedded Qwen.</text>

<rect x="235" y="102" width="1170" height="582" rx="12" fill="#f1faf5" stroke="#309b67" stroke-width="2" stroke-dasharray="8 5"/>
<text x="250" y="130" class="head">ONE INTEGRATED BUNDLE  |  MobileNetV3 + ConvLSTM + Qwen3-0.6B</text>
<rect x="28" y="225" width="174" height="100" rx="12" fill="#edf5fa" stroke="#7c9bb5" stroke-width="2"/>
<text x="43" y="253" class="head">Camera NOW</text>
<text x="43" y="279" class="body">One RGB frame</text>
<text x="43" y="302" class="body">320 x 320 input</text>
<rect x="265" y="225" width="225" height="100" rx="12" fill="#edf5fa" stroke="#7c9bb5" stroke-width="2"/>
<text x="280" y="253" class="head">Visual encoder</text>
<text x="280" y="279" class="body">MobileNetV3-Large</text>
<text x="280" y="302" class="body">FPN: 128 channels</text>
<rect x="530" y="225" width="235" height="100" rx="12" fill="#edf5fa" stroke="#7c9bb5" stroke-width="2"/>
<text x="545" y="253" class="head">ConvLSTM memory</text>
<text x="545" y="279" class="body">Hidden + cell: 64 ch</text>
<text x="545" y="302" class="body">Carry state to next frame</text>
<rect x="815" y="212" width="245" height="126" rx="12" fill="#edf5fa" stroke="#7c9bb5" stroke-width="2"/>
<text x="830" y="240" class="head">Token projectors</text>
<text x="830" y="266" class="body">64 current visual tokens</text>
<text x="830" y="289" class="body">16 past-memory tokens</text>
<text x="830" y="312" class="body">80 tokens x 1024 dims</text>
<rect x="1110" y="212" width="265" height="126" rx="12" fill="#edf5fa" stroke="#7c9bb5" stroke-width="2"/>
<text x="1125" y="240" class="head">Embedded Qwen3-0.6B</text>
<text x="1125" y="266" class="body">Visual + memory + query</text>
<text x="1125" y="289" class="body">Generates VQA JSON</text>
<text x="1125" y="312" class="body">VQA language branch</text>
<rect x="1090" y="426" width="285" height="108" rx="12" fill="#fff4df" stroke="#d6a54b" stroke-width="2" stroke-dasharray="8 5"/>
<text x="1105" y="454" class="head">Optional segmentation</text>
<text x="1105" y="480" class="body">Qwen &lt;seg&gt; + spatial maps</text>
<text x="1105" y="503" class="body">Mask + presence output</text>
<rect x="540" y="441" width="330" height="92" rx="12" fill="#f5f0ff" stroke="#9b83bd" stroke-width="2" stroke-dasharray="8 5"/>
<text x="555" y="469" class="head">Experimental motion head</text>
<text x="555" y="495" class="body">Linear(64, 5), weak-label trained</text>
<text x="555" y="518" class="body">Not reliable enough for deployment</text>
<rect x="270" y="570" width="700" height="82" rx="12" fill="#fff" stroke="#309b67" stroke-width="2"/>
<text x="285" y="598" class="head">--no-segmentation</text>
<text x="285" y="624" class="body">Skips mask/presence and the segmentation LM prepass.</text>
